retrieval:
  strategy: hybrid

  metadata_filters:
    - industry
    - technology
    - proposal_type
    - document_type
    - approval_status
    - confidentiality

  vector_search:
    top_k: 20
    similarity_threshold: 0.5

  keyword_search:
    enabled: true

  reranking:
    enabled: false  # not needed for MVP

  ranking_weights:
    approval_status: 0.25
    proposal_type: 0.20
    industry: 0.20
    technology: 0.15
    semantic_relevance: 0.15
    recency: 0.05

  separate_content_and_layout: true
