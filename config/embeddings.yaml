embeddings:
  provider: local
  model: all-MiniLM-L6-v2
  dimensions: 384

  granularity:
    ppt:
      - slide  # embed each slide as a unit
    docx:
      - section  # embed each heading section

  types:
    - content  # text content embedding

  cache:
    enabled: true
    use_content_hash: true  # skip re-embedding unchanged content
    storage_dir: extracted/embeddings/
